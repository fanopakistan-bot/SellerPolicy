<style>
:root{--bg:#12030a;--wine:#3a0611;--red:#a1121f;--red2:#6e0b17;--gold:#e8c064;--gold2:#b98a2c;--cream:#fff3d4;--card:rgba(22,4,10,.82);--line:rgba(232,192,100,.35)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#4a0713 0%,var(--bg) 62%) fixed;color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;line-height:1.6;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.ur{font-family:'Noto Nastaliq Urdu','Amiri',serif;line-height:2.2}
body.ar{font-family:'Amiri','Noto Naskh Arabic',serif;line-height:1.9}
/* animated logo background */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg img{position:absolute;top:50%;left:50%;width:min(95vmin,760px);opacity:.2;filter:sepia(1) saturate(3.2) hue-rotate(-28deg) blur(1px) drop-shadow(0 0 40px rgba(232,192,100,.5));animation:float 16s ease-in-out infinite}
.bg .ring{position:absolute;top:50%;left:50%;width:min(120vmin,940px);aspect-ratio:1;border-radius:50%;border:1px dashed rgba(232,192,100,.28);animation:spin 60s linear infinite;translate:-50% -50%}
.bg .ring.b{width:min(80vmin,620px);animation-direction:reverse;animation-duration:44s;border-style:dotted}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,3,10,.55),rgba(18,3,10,.25) 40%,rgba(18,3,10,.7))}
.spark{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);opacity:0;animation:rise linear infinite}
@keyframes float{0%,100%{transform:translate(-50%,-50%) rotate(-5deg) scale(1)}50%{transform:translate(-50%,-53%) rotate(5deg) scale(1.07)}}
@keyframes spin{to{transform:translate(0,0) rotate(360deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-105vh)}}
/* language gate */
#gate{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:2rem 1rem;text-align:center}
#gate .crest{width:132px;height:132px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 8px rgba(161,18,31,.55),0 0 50px rgba(232,192,100,.55);animation:pulse 3.2s ease-in-out infinite;object-fit:cover;background:#2a0710}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(161,18,31,.3),0 0 80px rgba(232,192,100,.8)}}
.gold{background:linear-gradient(100deg,#9a6b17 10%,#ffe9a6 30%,#e8c064 45%,#fff3c4 55%,#b98a2c 75%,#ffe9a6 95%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
#gate h1{font-family:'Cinzel',serif;font-size:clamp(2rem,7vw,3.6rem);letter-spacing:.08em;font-weight:900}
#gate p{font-size:1.3rem;color:var(--cream);text-shadow:0 2px 8px #000}
.langs{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.lang{cursor:pointer;min-width:170px;padding:.9rem 1.6rem;border-radius:14px;border:1.5px solid var(--gold);background:linear-gradient(160deg,#8f1020,#4d0813);color:var(--cream);font-size:1.5rem;font-weight:700;transition:transform .25s,box-shadow .25s,background .25s;font-family:inherit}
.lang small{display:block;font-size:.85rem;font-weight:500;color:var(--gold);font-family:'Cormorant Garamond',serif}
.lang:hover,.lang:focus-visible{transform:translateY(-5px) scale(1.04);box-shadow:0 10px 30px rgba(232,192,100,.4);background:linear-gradient(160deg,#b3162a,#65091a);outline:none}
.lang[data-l=ur]{font-family:'Noto Nastaliq Urdu',serif;line-height:1.9}
.lang[data-l=ar]{font-family:'Amiri',serif}
/* page */
#page{position:relative;z-index:2;display:none;max-width:1000px;margin:0 auto;padding:1.2rem 1rem 3rem}
#page.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.5rem}
.top .mini{display:flex;gap:.4rem}
.top button{cursor:pointer;padding:.3rem .9rem;border-radius:99px;border:1px solid var(--gold);background:var(--card);color:var(--cream);font-family:inherit;font-size:1rem}
.top button.act{background:var(--gold);color:#2a0710;font-weight:700}
.top button:focus-visible{outline:2px solid var(--cream)}
.brand{display:flex;align-items:center;gap:.7rem;font-family:'Cinzel',serif;font-weight:900;font-size:1.4rem;letter-spacing:.1em}
.brand img{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold)}
.hero{text-align:center;padding:1.5rem 0 2rem}
.hero h1{font-family:'Cinzel',serif;font-size:clamp(1.9rem,6vw,3.4rem);font-weight:900;letter-spacing:.06em;line-height:1.3;animation:drop 1.1s cubic-bezier(.2,.8,.2,1) both}
body.ur .hero h1,body.ar .hero h1{font-family:inherit;letter-spacing:0;line-height:1.7}
.hero .rule{height:2px;width:0;margin:1rem auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.4s .5s forwards}
@keyframes drop{from{opacity:0;transform:translateY(-30px);letter-spacing:.3em}}
@keyframes grow{to{width:min(420px,80%)}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.6rem clamp(1rem,3vw,2rem);margin-bottom:1.6rem;backdrop-filter:blur(6px);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(161,18,31,.35);opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}
.sec.in{opacity:1;transform:none}
.sec h2{font-family:'Cinzel',serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;margin-bottom:.8rem;padding-bottom:.6rem;border-bottom:1px solid var(--line);position:relative}
body.ur .sec h2,body.ar .sec h2{font-family:inherit;line-height:1.8}
.sec h2::after{content:"";position:absolute;bottom:-1px;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width 1.4s .3s}
.sec.in h2::after{width:120px}
.sec p{margin:.6rem 0;color:var(--cream)}
b,strong{color:var(--gold);font-weight:700}
.callout{margin:1rem 0;padding:.9rem 1.2rem;border-radius:12px;border-inline-start:5px solid var(--gold);background:linear-gradient(90deg,rgba(161,18,31,.55),rgba(60,6,16,.6))}
.wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--gold);margin:1.2rem 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:640px;font-family:'Cormorant Garamond',serif;font-variant-numeric:lining-nums tabular-nums;font-size:1.12rem}
th{background:linear-gradient(180deg,#b3162a,#6e0b17);color:#ffe9a6;padding:.75rem .6rem;font-weight:700;text-align:center;border-bottom:2px solid var(--gold);position:sticky;top:0;line-height:1.35}
body.ur th,body.ar th{font-family:inherit;line-height:1.9}
td{padding:.6rem;text-align:center;border-bottom:1px solid rgba(232,192,100,.18);color:var(--cream);font-weight:600}
tbody tr{background:rgba(20,4,10,.85);transition:background .25s}
tbody tr:nth-child(even){background:rgba(70,8,20,.75)}
tbody tr:hover{background:rgba(161,18,31,.7)}
td.lv{color:var(--gold);font-weight:700}
td.tot{color:#ffe08a;font-weight:700;background:rgba(232,192,100,.09)}
.sec.in tbody tr{animation:row .6s both}
@keyframes row{from{opacity:0;transform:translateX(-20px)}}
[dir=rtl] .sec.in tbody tr{animation-name:rowr}
@keyframes rowr{from{opacity:0;transform:translateX(20px)}}
.rate{display:inline-block;margin-top:.4rem;padding:.6rem 1.4rem;border-radius:99px;border:1px solid var(--gold);background:linear-gradient(90deg,#8f1020,#4d0813);font-weight:700;color:var(--cream);font-size:1.3rem;animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px rgba(232,192,100,.6)}}
.ch{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem;margin-top:1rem}
.ch li{padding:1rem;text-align:center;border-radius:14px;border:1px solid var(--gold);background:linear-gradient(160deg,rgba(161,18,31,.7),rgba(40,4,12,.9));font-weight:700;font-size:1.3rem;transition:transform .3s,box-shadow .3s}
.ch li:hover{transform:translateY(-6px);box-shadow:0 12px 26px rgba(232,192,100,.35)}
.foot{text-align:center;color:var(--gold);font-size:1.1rem;padding:1rem;border-top:1px solid var(--line)}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:2.1rem;height:2.1rem;padding:0 .5rem;margin-inline-end:.7rem;border-radius:99px;background:linear-gradient(160deg,#b3162a,#6e0b17);border:1px solid var(--gold);color:#ffe9a6;font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:700;vertical-align:middle;-webkit-text-fill-color:#ffe9a6}
.sec h3{font-size:1.3rem;color:var(--gold);margin:1.2rem 0 .3rem;font-weight:700}
body.ur .sec h3,body.ar .sec h3{line-height:1.9}
.lst{list-style:none;padding:0;margin:.6rem 0;counter-reset:c}
.lst li{position:relative;padding:.35rem 0;padding-inline-start:2.4rem;counter-increment:c}
ul.lst li::before{content:"";position:absolute;inset-inline-start:.7rem;top:1.05em;width:.6rem;height:.6rem;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 8px var(--gold)}
ol.lst li::before{content:counter(c);position:absolute;inset-inline-start:0;top:.45rem;width:1.7rem;height:1.7rem;border-radius:50%;background:linear-gradient(160deg,#b3162a,#6e0b17);border:1px solid var(--gold);color:#ffe9a6;font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.callout.sign{line-height:2;text-align:center;border-inline-start:0;border:1px solid var(--gold)}
.sec h2 .n{font-size:1.2rem}
@media(max-width:640px){
body{font-size:1.08rem}
.bg img{width:120vmin;opacity:.17}
.spark:nth-child(n+14){display:none}
#gate{gap:1.2rem;padding:1.5rem 1rem}
#gate .crest{width:104px;height:104px}
#gate p{font-size:1.1rem;line-height:1.7}
.langs{width:100%;flex-direction:column;gap:.8rem}
.lang{width:100%;min-height:60px}
#page{padding:.8rem .7rem 2.5rem}
.top{position:sticky;top:0;z-index:5;margin:0 -.7rem 1rem;padding:.5rem .7rem;background:rgba(18,3,10,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{font-size:1.15rem}.brand img{width:36px;height:36px}
.top button{padding:.4rem .8rem;min-height:38px;font-size:.95rem}
.hero{padding:.8rem 0 1.4rem}
.sec{padding:1.1rem .9rem;border-radius:16px;margin-bottom:1.2rem}
.callout{padding:.8rem .9rem}
.wrap{overflow:visible;border:0;background:none;margin:1rem 0}
table,tbody{display:block;width:100%;min-width:0!important}
thead{display:none}
tbody tr,tbody tr:nth-child(even){display:block;margin-bottom:.9rem;border:1px solid var(--gold);border-radius:14px;overflow:hidden;background:rgba(22,4,10,.92)}
tbody tr:hover{background:rgba(22,4,10,.92)}
td{display:flex;justify-content:space-between;align-items:center;gap:.8rem;text-align:end;padding:.55rem .9rem;font-size:1.05rem}
td::before{content:attr(data-k);color:var(--gold);font-weight:700;text-align:start;flex:0 0 48%;font-size:.98rem}
td.lv{background:linear-gradient(90deg,#b3162a,#6e0b17);color:#ffe9a6;font-size:1.2rem}
td.lv::before{color:var(--cream)}
td.tot{background:rgba(232,192,100,.14)}
.rate{font-size:1.1rem;padding:.5rem 1rem}
.ch{grid-template-columns:1fr 1fr;gap:.7rem}
.ch li{padding:.8rem .4rem;font-size:1.1rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sec{opacity:1;transform:none}}
</style>
</head>

en:{dir:'ltr',title:`Fano — Coinseller Policy`,
th1:[`Top-Up Amount (USD)`,`Coin Price for 1 USD`,`Total Coins`,`Profit (USD)`],th2:[`User Payment`,`Minimum Coins`,`Recommended Coins`,`Maximum Coins`],
s:[
['',`Official Coinseller Policy`,[['p',`This policy outlines the requirements, responsibilities, payment terms, and operating rules for <b>Fano Pakistan Coinsellers/Resellers</b>. All Coinsellers are expected to read and understand the following terms before participating in the program.`],['h3','1.1',`Coinseller Top-Up Packages`],['p',`First Recharge for Coinseller should be <b>1000 USD</b>. Later on, the recharge amount can be as mentioned below.`],['tb1'],['note',`<b>Note:</b> The package rates and benefits may be revised by Fano Pakistan when necessary. Coinsellers will be expected to follow the latest officially communicated rates.`]]],
['2',`Eligibility for Coinseller Status`,[['p',`A Coinseller may qualify for the program under the following conditions:`],['h3','A',`High-Performance Agencies`],['p',`If an agency's <b>monthly diamond revenue reaches 600,000,000 diamonds</b>, the agency may apply to become a Coinseller <b>without paying the security deposit</b>.`],['h3','B',`Regular Users / Other Applicants`],['p',`If the applicant does not meet the required monthly diamond revenue, or is applying as a regular user, a <b>$500 security deposit</b> is required to apply for Coinseller status.`]]],
['3',`Security Deposit`,[['ol',[`The required security deposit is <b>$500</b>, where applicable.`,`The deposit is refundable upon the successful completion of the Coinseller's work and termination of coinselling.`,`Fano Pakistan reserves the right to withhold or review the deposit in cases involving violations, fraudulent activity, unpaid obligations, or other breaches of this policy.`]]]],
['4',`Payment Before Coin Transfer`,[['p',`Coinsellers must ensure that they have <b>received and confirmed payment from the user before transferring coins</b>.`],['p',`Fano Pakistan will not be responsible for financial losses resulting from a Coinseller transferring coins before receiving payment from the user.`],['p',`Coinsellers are therefore responsible for maintaining proper payment records and verifying each transaction.`]]],
['5',`Prohibited Activities`,[['p',`Coinsellers must not engage in activities that violate Fano Pakistan's rules or damage the interests of users or the platform.`],['p',`Prohibited activities include, but are not limited to:`],['ul',[`Receiving money from users without providing the corresponding coins.`,`Failing to complete a confirmed top-up.`,`Misleading or deceiving users regarding coin prices or transactions.`,`Redirecting users to competing or unauthorized applications.`,`Using Coinseller privileges for fraudulent or unauthorized purposes.`,`Engaging in any activity that may harm Fano Pakistan, its users, agencies, or other Coinsellers.`]],['p',`If a Coinseller is confirmed to have violated these rules, <b>their Coinseller account may be immediately suspended or closed and the partnership may be terminated</b>.`]]],
['6',`Inactive Coinsellers & User Complaints`,[['p',`If a Coinseller:`],['ul',[`Does not sell coins for <b>three consecutive months</b>, or`,`Receives a significant number of verified complaints from users,`]],['p',`Fano Pakistan reserves the right to <b>review, suspend, or terminate the Coinseller account</b>.`],['p',`The platform may consider the Coinseller's transaction history, complaint records, and overall activity when conducting such a review.`]]],
['7',`Coinseller Selling Rate to Users`,[['p',`Coinsellers must follow the approved user-selling rate established by Fano Pakistan.`],['ul',[`Recommended rate: <b>PKR 290 = 200,000 coins</b>`,`Coinsellers may provide up to 220,000 coins for PKR 290, where permitted.`,`The number of coins provided to a user for PKR 290 should not be below 200,000 coins and should not exceed 220,000 coins.`,`Coinsellers must clearly communicate the applicable rate to users before completing a transaction.`,`Coinsellers must not mislead users regarding the coin amount, price, or applicable exchange rate.`,`Any changes to the approved selling range or recommended rate will be communicated officially by Fano Pakistan.`]],['h3','',`Example`],['tb2'],['p',`Recommended standard: <b>PKR 290 = 200,000 coins</b>`]]],
['8',`Coinseller Responsibilities`,[['p',`Every Coinseller is responsible for:`],['ol',[`Providing accurate information to users.`,`Clearly communicating the applicable coin price before completing a transaction.`,`Confirming payment before transferring coins.`,`Keeping transaction records.`,`Protecting user payment information and transaction details.`,`Following all Fano Pakistan platform rules.`,`Reporting suspicious transactions or fraudulent activity to the appropriate Fano Pakistan representative.`,`Maintaining professional and respectful communication with users.`]]]],
['9',`Transaction Disputes`,[['p',`If a dispute occurs between a Coinseller and a user, both parties may be required to provide relevant evidence, such as:`],['ul',[`Payment receipts`,`Transaction records`,`Screenshots`,`User/account information relevant to the transaction`,`Other supporting evidence requested by Fano Pakistan`]],['p',`Fano Pakistan may review the available evidence before taking action regarding the disputed transaction.`]]],
['10',`Fraud & Account Security`,[['p',`Coinsellers must take reasonable precautions to prevent unauthorized transactions and fraudulent activity.`],['p',`A Coinseller must not:`],['ul',[`Share their Coinseller account credentials with unauthorized individuals.`,`Allow another person to operate their account without authorization.`,`Manipulate transaction records.`,`Use fraudulent payment methods.`,`Participate in money laundering, scams, or other unlawful activities.`]],['p',`Confirmed fraudulent or unauthorized activity may result in <b>immediate suspension or termination</b> of Coinseller privileges and may be referred to the appropriate authorities where required.`]]],
['11',`Policy Violations`,[['p',`Depending on the nature and severity of a violation, Fano Pakistan may take one or more of the following actions:`],['ul',[`Issue a warning.`,`Temporarily suspend Coinseller privileges.`,`Restrict transactions.`,`Conduct an account review.`,`Withhold or review a security deposit where applicable.`,`Permanently terminate the Coinseller partnership.`,`Take further action where required by applicable law or platform rules.`]]]],
['12',`Policy Updates`,[['p',`Fano Pakistan reserves the right to modify, update, or replace this Coinseller Policy when necessary.`],['p',`Coinsellers are responsible for staying informed about the latest version of the policy and any updated rates, procedures, requirements, or payment methods officially communicated by Fano Pakistan.`]]],
['',`Fano Pakistan Coinseller Agreement`,[['p',`By applying for or operating as a Fano Pakistan Coinseller, the applicant acknowledges that they have <b>read, understood, and agreed to comply with this Coinseller Policy</b>.`],['p',`Failure to comply with these requirements may result in suspension or termination of Coinseller privileges.`],['sign',`<b>Fano Pakistan</b><br><b>Coinseller / Reseller Program</b><br><i>Fair Transactions • Secure Payments • Reliable Service</i>`]]]
]},
ur:{dir:'rtl',title:`فانو — کوائن سیلر پالیسی`,
th1:[`ٹاپ اپ رقم (USD)`,`1 USD کی کوائن قیمت`,`کل کوائنز`,`منافع (USD)`],th2:[`صارف کی ادائیگی`,`کم از کم کوائنز`,`تجویز کردہ کوائنز`,`زیادہ سے زیادہ کوائنز`],
s:[
['',`سرکاری کوائن سیلر پالیسی`,[['p',`یہ پالیسی <b>فانو پاکستان کوائن سیلرز/ری سیلرز</b> کے لیے تقاضوں، ذمہ داریوں، ادائیگی کی شرائط اور آپریٹنگ اصولوں کی وضاحت کرتی ہے۔ تمام کوائن سیلرز سے توقع کی جاتی ہے کہ وہ پروگرام میں شرکت سے پہلے درج ذیل شرائط کو پڑھیں اور سمجھیں۔`],['h3','1.1',`کوائن سیلر ٹاپ اپ پیکجز`],['p',`کوائن سیلر کا پہلا ریچارج <b>1000 امریکی ڈالر</b> ہونا چاہیے۔ اس کے بعد ریچارج کی رقم نیچے دی گئی تفصیل کے مطابق ہو سکتی ہے۔`],['tb1'],['note',`<b>نوٹ:</b> فانو پاکستان ضرورت پڑنے پر پیکج کے ریٹس اور فوائد میں ترمیم کر سکتا ہے۔ کوائن سیلرز سے توقع کی جاتی ہے کہ وہ سرکاری طور پر بتائے گئے تازہ ترین ریٹس کی پابندی کریں۔`]]],
['2',`کوائن سیلر کا درجہ حاصل کرنے کی اہلیت`,[['p',`کوائن سیلر درج ذیل شرائط کے تحت پروگرام کے لیے اہل ہو سکتا ہے:`],['h3','ا',`زیادہ کارکردگی والی ایجنسیاں`],['p',`اگر کسی ایجنسی کی <b>ماہانہ ڈائمنڈ آمدنی 600,000,000 ڈائمنڈز تک پہنچ جائے</b> تو ایجنسی <b>سیکیورٹی ڈپازٹ ادا کیے بغیر</b> کوائن سیلر بننے کے لیے درخواست دے سکتی ہے۔`],['h3','ب',`عام صارفین / دیگر درخواست دہندگان`],['p',`اگر درخواست دہندہ مطلوبہ ماہانہ ڈائمنڈ آمدنی پوری نہیں کرتا، یا عام صارف کے طور پر درخواست دے رہا ہے تو کوائن سیلر کے درجے کے لیے درخواست دینے کے لیے <b>500 ڈالر کا سیکیورٹی ڈپازٹ</b> درکار ہے۔`]]],
['3',`سیکیورٹی ڈپازٹ`,[['ol',[`مطلوبہ سیکیورٹی ڈپازٹ، جہاں لاگو ہو، <b>500 ڈالر</b> ہے۔`,`ڈپازٹ کوائن سیلر کے کام کی کامیاب تکمیل اور کوائن سیلنگ ختم ہونے پر قابل واپسی ہے۔`,`خلاف ورزیوں، دھوکہ دہی، غیر ادا شدہ واجبات یا اس پالیسی کی دیگر خلاف ورزیوں کی صورت میں فانو پاکستان ڈپازٹ روکنے یا اس کا جائزہ لینے کا حق محفوظ رکھتا ہے۔`]]]],
['4',`کوائن منتقل کرنے سے پہلے ادائیگی`,[['p',`کوائن سیلرز کو یقینی بنانا ہوگا کہ انہوں نے <b>کوائنز منتقل کرنے سے پہلے صارف سے ادائیگی وصول اور تصدیق کر لی ہے</b>۔`],['p',`اگر کوئی کوائن سیلر صارف سے ادائیگی وصول کرنے سے پہلے کوائنز منتقل کر دے تو اس کے نتیجے میں ہونے والے مالی نقصان کا فانو پاکستان ذمہ دار نہیں ہوگا۔`],['p',`لہٰذا کوائن سیلرز ادائیگی کا درست ریکارڈ رکھنے اور ہر لین دین کی تصدیق کرنے کے ذمہ دار ہیں۔`]]],
['5',`ممنوعہ سرگرمیاں`,[['p',`کوائن سیلرز ایسی سرگرمیوں میں ملوث نہیں ہو سکتے جو فانو پاکستان کے قواعد کی خلاف ورزی کریں یا صارفین یا پلیٹ فارم کے مفادات کو نقصان پہنچائیں۔`],['p',`ممنوعہ سرگرمیوں میں یہ شامل ہیں، لیکن ان تک محدود نہیں:`],['ul',[`صارفین سے رقم لینا لیکن متعلقہ کوائنز فراہم نہ کرنا۔`,`تصدیق شدہ ٹاپ اپ مکمل نہ کرنا۔`,`کوائن کی قیمتوں یا لین دین کے بارے میں صارفین کو گمراہ کرنا یا دھوکہ دینا۔`,`صارفین کو حریف یا غیر مجاز ایپلیکیشنز کی طرف بھیجنا۔`,`کوائن سیلر کے اختیارات کو دھوکہ دہی یا غیر مجاز مقاصد کے لیے استعمال کرنا۔`,`ایسی کسی بھی سرگرمی میں ملوث ہونا جو فانو پاکستان، اس کے صارفین، ایجنسیوں یا دیگر کوائن سیلرز کو نقصان پہنچا سکتی ہو۔`]],['p',`اگر کسی کوائن سیلر کی طرف سے ان قواعد کی خلاف ورزی ثابت ہو جائے تو <b>اس کا کوائن سیلر اکاؤنٹ فوری طور پر معطل یا بند کیا جا سکتا ہے اور شراکت داری ختم کی جا سکتی ہے</b>۔`]]],
['6',`غیر فعال کوائن سیلرز اور صارفین کی شکایات`,[['p',`اگر کوئی کوائن سیلر:`],['ul',[`<b>مسلسل تین ماہ</b> تک کوائنز فروخت نہیں کرتا، یا`,`صارفین کی جانب سے تصدیق شدہ شکایات کی نمایاں تعداد موصول کرتا ہے،`]],['p',`تو فانو پاکستان <b>کوائن سیلر اکاؤنٹ کا جائزہ لینے، اسے معطل کرنے یا ختم کرنے</b> کا حق محفوظ رکھتا ہے۔`],['p',`اس جائزے کے دوران پلیٹ فارم کوائن سیلر کی لین دین کی تاریخ، شکایات کے ریکارڈ اور مجموعی سرگرمی کو مدنظر رکھ سکتا ہے۔`]]],
['7',`صارفین کو کوائن سیلر کا فروخت ریٹ`,[['p',`کوائن سیلرز کو فانو پاکستان کے مقرر کردہ منظور شدہ صارف فروخت ریٹ کی پابندی کرنا ہوگی۔`],['ul',[`تجویز کردہ ریٹ: <b><bdi>PKR 290 = 200,000</bdi> کوائنز</b>`,`کوائن سیلرز، جہاں اجازت ہو، <bdi>PKR 290</bdi> کے بدلے 220,000 کوائنز تک دے سکتے ہیں۔`,`<bdi>PKR 290</bdi> کے بدلے صارف کو دیے جانے والے کوائنز 200,000 سے کم اور 220,000 سے زیادہ نہیں ہونے چاہئیں۔`,`کوائن سیلرز کو لین دین مکمل کرنے سے پہلے صارفین کو لاگو ریٹ واضح طور پر بتانا ہوگا۔`,`کوائن سیلرز کوائنز کی مقدار، قیمت یا لاگو ایکسچینج ریٹ کے بارے میں صارفین کو گمراہ نہیں کر سکتے۔`,`منظور شدہ فروخت کی حد یا تجویز کردہ ریٹ میں کوئی بھی تبدیلی فانو پاکستان کی جانب سے سرکاری طور پر بتائی جائے گی۔`]],['h3','',`مثال`],['tb2'],['p',`تجویز کردہ معیار: <b><bdi>PKR 290 = 200,000</bdi> کوائنز</b>`]]],
['8',`کوائن سیلر کی ذمہ داریاں`,[['p',`ہر کوائن سیلر درج ذیل کا ذمہ دار ہے:`],['ol',[`صارفین کو درست معلومات فراہم کرنا۔`,`لین دین مکمل کرنے سے پہلے کوائن کی لاگو قیمت واضح طور پر بتانا۔`,`کوائنز منتقل کرنے سے پہلے ادائیگی کی تصدیق کرنا۔`,`لین دین کا ریکارڈ رکھنا۔`,`صارفین کی ادائیگی کی معلومات اور لین دین کی تفصیلات کا تحفظ کرنا۔`,`فانو پاکستان کے پلیٹ فارم کے تمام قواعد کی پیروی کرنا۔`,`مشکوک لین دین یا دھوکہ دہی کی سرگرمی کی اطلاع فانو پاکستان کے متعلقہ نمائندے کو دینا۔`,`صارفین کے ساتھ پیشہ ورانہ اور باعزت رابطہ برقرار رکھنا۔`]]]],
['9',`لین دین کے تنازعات`,[['p',`اگر کوائن سیلر اور صارف کے درمیان کوئی تنازع پیدا ہو تو دونوں فریقین سے متعلقہ ثبوت فراہم کرنے کی ضرورت ہو سکتی ہے، مثلاً:`],['ul',[`ادائیگی کی رسیدیں`,`لین دین کا ریکارڈ`,`اسکرین شاٹس`,`لین دین سے متعلق صارف/اکاؤنٹ کی معلومات`,`فانو پاکستان کی جانب سے طلب کردہ دیگر معاون ثبوت`]],['p',`متنازع لین دین کے بارے میں کارروائی کرنے سے پہلے فانو پاکستان دستیاب ثبوت کا جائزہ لے سکتا ہے۔`]]],
['10',`فراڈ اور اکاؤنٹ کی سیکیورٹی`,[['p',`کوائن سیلرز کو غیر مجاز لین دین اور دھوکہ دہی کی سرگرمی سے بچاؤ کے لیے معقول احتیاطی تدابیر اختیار کرنا ہوں گی۔`],['p',`کوائن سیلر کو یہ نہیں کرنا چاہیے:`],['ul',[`اپنے کوائن سیلر اکاؤنٹ کی معلومات غیر مجاز افراد کے ساتھ شیئر کرنا۔`,`کسی دوسرے شخص کو اجازت کے بغیر اپنا اکاؤنٹ چلانے دینا۔`,`لین دین کے ریکارڈ میں ہیرا پھیری کرنا۔`,`ادائیگی کے جعلی طریقے استعمال کرنا۔`,`منی لانڈرنگ، دھوکہ دہی یا دیگر غیر قانونی سرگرمیوں میں حصہ لینا۔`]],['p',`تصدیق شدہ دھوکہ دہی یا غیر مجاز سرگرمی کے نتیجے میں کوائن سیلر کے اختیارات <b>فوری طور پر معطل یا ختم</b> کیے جا سکتے ہیں اور ضرورت پڑنے پر معاملہ متعلقہ حکام کے سپرد کیا جا سکتا ہے۔`]]],
['11',`پالیسی کی خلاف ورزیاں`,[['p',`خلاف ورزی کی نوعیت اور شدت کے مطابق فانو پاکستان درج ذیل میں سے ایک یا زیادہ کارروائیاں کر سکتا ہے:`],['ul',[`تنبیہ جاری کرنا۔`,`کوائن سیلر کے اختیارات عارضی طور پر معطل کرنا۔`,`لین دین محدود کرنا۔`,`اکاؤنٹ کا جائزہ لینا۔`,`جہاں لاگو ہو سیکیورٹی ڈپازٹ روکنا یا اس کا جائزہ لینا۔`,`کوائن سیلر شراکت داری مستقل طور پر ختم کرنا۔`,`قابل اطلاق قانون یا پلیٹ فارم کے قواعد کے تحت مزید کارروائی کرنا۔`]]]],
['12',`پالیسی میں تبدیلیاں`,[['p',`فانو پاکستان ضرورت پڑنے پر اس کوائن سیلر پالیسی میں ترمیم، تجدید یا اسے تبدیل کرنے کا حق محفوظ رکھتا ہے۔`],['p',`کوائن سیلرز پالیسی کے تازہ ترین ورژن اور فانو پاکستان کی جانب سے سرکاری طور پر بتائے گئے ریٹس، طریقہ کار، تقاضوں یا ادائیگی کے طریقوں سے باخبر رہنے کے ذمہ دار ہیں۔`]]],
['',`فانو پاکستان کوائن سیلر معاہدہ`,[['p',`فانو پاکستان کوائن سیلر کے طور پر درخواست دے کر یا کام کر کے درخواست دہندہ تسلیم کرتا ہے کہ اس نے <b>اس کوائن سیلر پالیسی کو پڑھ لیا ہے، سمجھ لیا ہے اور اس کی پابندی کرنے پر متفق ہے</b>۔`],['p',`ان تقاضوں کی پابندی نہ کرنے کے نتیجے میں کوائن سیلر کے اختیارات معطل یا ختم کیے جا سکتے ہیں۔`],['sign',`<b>فانو پاکستان</b><br><b>کوائن سیلر / ری سیلر پروگرام</b><br><i>منصفانہ لین دین • محفوظ ادائیگیاں • قابل اعتماد سروس</i>`]]]
]},
ar:{dir:'rtl',title:`فانو — سياسة بائعي العملات`,
th1:[`مبلغ الشحن (USD)`,`سعر العملات لكل 1 USD`,`إجمالي العملات`,`الربح (USD)`],th2:[`دفعة المستخدم`,`الحد الأدنى للعملات`,`العملات الموصى بها`,`الحد الأقصى للعملات`],
s:[
['',`سياسة بائعي العملات الرسمية`,[['p',`تحدد هذه السياسة المتطلبات والمسؤوليات وشروط الدفع وقواعد التشغيل الخاصة <b>ببائعي العملات/الموزعين في فانو باكستان</b>. يُتوقع من جميع بائعي العملات قراءة الشروط التالية وفهمها قبل المشاركة في البرنامج.`],['h3','1.1',`باقات الشحن لبائعي العملات`],['p',`يجب أن يكون أول شحن لبائع العملات <b>1000 دولار أمريكي</b>. وبعد ذلك، يمكن أن يكون مبلغ الشحن وفق ما هو موضح أدناه.`],['tb1'],['note',`<b>ملاحظة:</b> يجوز لفانو باكستان مراجعة أسعار الباقات ومزاياها عند الحاجة. ويُتوقع من بائعي العملات الالتزام بأحدث الأسعار المعلنة رسميًا.`]]],
['2',`أهلية الحصول على صفة بائع العملات`,[['p',`يجوز أن يتأهل بائع العملات للبرنامج وفق الشروط التالية:`],['h3','أ',`الوكالات عالية الأداء`],['p',`إذا بلغت <b>إيرادات الوكالة الشهرية من الألماس 600,000,000 ألماسة</b>، يجوز للوكالة التقدم لتصبح بائع عملات <b>دون دفع وديعة الضمان</b>.`],['h3','ب',`المستخدمون العاديون / المتقدمون الآخرون`],['p',`إذا لم يستوفِ المتقدم الحد المطلوب من الإيرادات الشهرية بالألماس، أو كان يتقدم بصفة مستخدم عادي، فيلزم دفع <b>وديعة ضمان قدرها 500 دولار</b> للتقدم بطلب صفة بائع عملات.`]]],
['3',`وديعة الضمان`,[['ol',[`وديعة الضمان المطلوبة هي <b>500 دولار</b> حيثما ينطبق ذلك.`,`الوديعة قابلة للاسترداد عند الإتمام الناجح لعمل بائع العملات وإنهاء بيع العملات.`,`تحتفظ فانو باكستان بالحق في حجز الوديعة أو مراجعتها في حالات المخالفات أو الاحتيال أو الالتزامات غير المسددة أو غيرها من خروقات هذه السياسة.`]]]],
['4',`الدفع قبل تحويل العملات`,[['p',`يجب على بائعي العملات التأكد من أنهم <b>استلموا الدفعة من المستخدم وتأكدوا منها قبل تحويل العملات</b>.`],['p',`لن تتحمل فانو باكستان مسؤولية الخسائر المالية الناتجة عن قيام بائع العملات بتحويل العملات قبل استلام الدفعة من المستخدم.`],['p',`ولذلك يتحمل بائعو العملات مسؤولية الاحتفاظ بسجلات دفع سليمة والتحقق من كل معاملة.`]]],
['5',`الأنشطة المحظورة`,[['p',`يجب على بائعي العملات عدم ممارسة أنشطة تخالف قواعد فانو باكستان أو تضر بمصالح المستخدمين أو المنصة.`],['p',`تشمل الأنشطة المحظورة على سبيل المثال لا الحصر:`],['ul',[`استلام أموال من المستخدمين دون تقديم العملات المقابلة لها.`,`عدم إتمام عملية شحن مؤكدة.`,`تضليل المستخدمين أو خداعهم بشأن أسعار العملات أو المعاملات.`,`توجيه المستخدمين إلى تطبيقات منافسة أو غير مصرّح بها.`,`استخدام صلاحيات بائع العملات لأغراض احتيالية أو غير مصرّح بها.`,`ممارسة أي نشاط قد يضر بفانو باكستان أو مستخدميها أو وكالاتها أو غيرهم من بائعي العملات.`]],['p',`إذا ثبتت مخالفة بائع العملات لهذه القواعد، <b>فقد يتم تعليق حسابه أو إغلاقه فورًا وإنهاء الشراكة</b>.`]]],
['6',`بائعو العملات غير النشطين وشكاوى المستخدمين`,[['p',`إذا كان بائع العملات:`],['ul',[`لا يبيع العملات لمدة <b>ثلاثة أشهر متتالية</b>، أو`,`يتلقى عددًا كبيرًا من الشكاوى الموثقة من المستخدمين،`]],['p',`فإن فانو باكستان تحتفظ بالحق في <b>مراجعة حساب بائع العملات أو تعليقه أو إنهائه</b>.`],['p',`يجوز للمنصة أن تراعي سجل معاملات بائع العملات وسجلات الشكاوى ونشاطه العام عند إجراء هذه المراجعة.`]]],
['7',`سعر بيع بائع العملات للمستخدمين`,[['p',`يجب على بائعي العملات الالتزام بسعر البيع المعتمد للمستخدمين الذي تحدده فانو باكستان.`],['ul',[`السعر الموصى به: <b><bdi>PKR 290 = 200,000</bdi> عملة</b>`,`يجوز لبائعي العملات تقديم ما يصل إلى 220,000 عملة مقابل <bdi>PKR 290</bdi> حيثما يُسمح بذلك.`,`يجب ألا يقل عدد العملات المقدمة للمستخدم مقابل <bdi>PKR 290</bdi> عن 200,000 عملة، وألا يزيد على 220,000 عملة.`,`يجب على بائعي العملات إبلاغ المستخدمين بوضوح بالسعر المطبق قبل إتمام المعاملة.`,`يجب على بائعي العملات عدم تضليل المستخدمين بشأن كمية العملات أو السعر أو سعر الصرف المطبق.`,`سيتم الإعلان رسميًا من قبل فانو باكستان عن أي تغييرات في نطاق البيع المعتمد أو السعر الموصى به.`]],['h3','',`مثال`],['tb2'],['p',`المعيار الموصى به: <b><bdi>PKR 290 = 200,000</bdi> عملة</b>`]]],
['8',`مسؤوليات بائع العملات`,[['p',`كل بائع عملات مسؤول عن:`],['ol',[`تقديم معلومات دقيقة للمستخدمين.`,`إبلاغ المستخدمين بوضوح بسعر العملات المطبق قبل إتمام المعاملة.`,`تأكيد الدفع قبل تحويل العملات.`,`الاحتفاظ بسجلات المعاملات.`,`حماية معلومات الدفع الخاصة بالمستخدمين وتفاصيل المعاملات.`,`اتباع جميع قواعد منصة فانو باكستان.`,`الإبلاغ عن المعاملات المشبوهة أو أنشطة الاحتيال إلى ممثل فانو باكستان المختص.`,`الحفاظ على تواصل مهني ومحترم مع المستخدمين.`]]]],
['9',`نزاعات المعاملات`,[['p',`في حال نشوب نزاع بين بائع العملات ومستخدم، فقد يُطلب من الطرفين تقديم الأدلة ذات الصلة، مثل:`],['ul',[`إيصالات الدفع`,`سجلات المعاملات`,`لقطات الشاشة`,`معلومات المستخدم/الحساب المتعلقة بالمعاملة`,`أي أدلة داعمة أخرى تطلبها فانو باكستان`]],['p',`يجوز لفانو باكستان مراجعة الأدلة المتاحة قبل اتخاذ أي إجراء بشأن المعاملة محل النزاع.`]]],
['10',`الاحتيال وأمان الحساب`,[['p',`يجب على بائعي العملات اتخاذ الاحتياطات المعقولة لمنع المعاملات غير المصرّح بها وأنشطة الاحتيال.`],['p',`يُحظر على بائع العملات:`],['ul',[`مشاركة بيانات حساب بائع العملات مع أشخاص غير مصرّح لهم.`,`السماح لشخص آخر بتشغيل حسابه دون تصريح.`,`التلاعب بسجلات المعاملات.`,`استخدام وسائل دفع احتيالية.`,`المشاركة في غسل الأموال أو عمليات النصب أو غيرها من الأنشطة غير القانونية.`]],['p',`قد يؤدي النشاط الاحتيالي أو غير المصرّح به المؤكد إلى <b>التعليق أو الإنهاء الفوري</b> لصلاحيات بائع العملات، وقد يتم إحالته إلى الجهات المختصة عند الاقتضاء.`]]],
['11',`مخالفات السياسة`,[['p',`بحسب طبيعة المخالفة وجسامتها، يجوز لفانو باكستان اتخاذ واحد أو أكثر من الإجراءات التالية:`],['ul',[`توجيه إنذار.`,`تعليق صلاحيات بائع العملات مؤقتًا.`,`تقييد المعاملات.`,`إجراء مراجعة للحساب.`,`حجز وديعة الضمان أو مراجعتها حيثما ينطبق ذلك.`,`إنهاء شراكة بائع العملات بشكل دائم.`,`اتخاذ إجراءات أخرى حسبما يقتضيه القانون المعمول به أو قواعد المنصة.`]]]],
['12',`تحديثات السياسة`,[['p',`تحتفظ فانو باكستان بالحق في تعديل سياسة بائعي العملات هذه أو تحديثها أو استبدالها عند الحاجة.`],['p',`يتحمل بائعو العملات مسؤولية البقاء على اطلاع بأحدث نسخة من السياسة وأي أسعار أو إجراءات أو متطلبات أو طرق دفع محدثة تعلنها فانو باكستان رسميًا.`]]],
['',`اتفاقية بائعي العملات في فانو باكستان`,[['p',`بالتقدم بطلب أو العمل بصفة بائع عملات لدى فانو باكستان، يقر المتقدم بأنه <b>قرأ سياسة بائعي العملات هذه وفهمها ووافق على الالتزام بها</b>.`],['p',`قد يؤدي عدم الالتزام بهذه المتطلبات إلى تعليق صلاحيات بائع العملات أو إنهائها.`],['sign',`<b>فانو باكستان</b><br><b>برنامج بائعي/موزعي العملات</b><br><i>معاملات عادلة • مدفوعات آمنة • خدمة موثوقة</i>`]]]
]}};
const R1=[['$500','230,000','115,000,000','$75'],['$1,000','240,000','240,000,000','$200'],['$3,000','245,000','735,000,000','$675']],R2=[['PKR 290','200,000','200,000','220,000']];
const tbl=(h,rows,tot)=>`<div class="wrap"><table style="min-width:480px"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr style="animation-delay:${i*.1}s">${r.map((c,j)=>`<td data-k="${h[j]}" class="${j==0?'lv':j==tot?'tot':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const blk=(b,t)=>{const[k,x,y]=b;
 if(k=='p')return `<p>${x}</p>`;
 if(k=='h3')return `<h3>${x?`<span class="n">${x}</span>`:''}${y}</h3>`;
 if(k=='ul'||k=='ol')return `<${k} class="lst">${x.map(i=>`<li>${i}</li>`).join('')}</${k}>`;
 if(k=='note')return `<div class="callout">${x}</div>`;
 if(k=='sign')return `<div class="callout sign">${x}</div>`;
 if(k=='tb1')return tbl(t.th1,R1,3);
 if(k=='tb2')return tbl(t.th2,R2,2)};
const LOGO=document.querySelector('.crest').src;
let obs;
function render(l){
  const t=T[l];
  document.documentElement.lang=l;document.documentElement.dir=t.dir;
  document.body.className=l;document.title=t.title;
  const sw=['en','ur','ar'].map(k=>`<button data-l="${k}" class="${k==l?'act':''}">${{en:'English',ur:'اردو',ar:'العربية'}[k]}</button>`).join('');
  const secs=t.s.map(([n,h,b])=>`<section class="sec"><h2 class="gold">${n?`<span class="n">${n}</span>`:''}${h}</h2>${b.map(x=>blk(x,t)).join('')}</section>`).join('');
  const p=document.getElementById('page');
  p.innerHTML=`<div class="top"><div class="brand gold"><img src="${LOGO}" alt="">FANO</div><div class="mini">${sw}</div></div>
  <header class="hero"><h1 class="gold">${t.title}</h1><div class="rule"></div></header>${secs}`;
  p.querySelectorAll('.mini button').forEach(b=>b.onclick=()=>render(b.dataset.l));
  if(obs)obs.disconnect();
  obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target)}}),{threshold:.05});
  p.querySelectorAll('.sec').forEach(s=>obs.observe(s));
  document.getElementById('gate').style.display='none';p.classList.add('on');window.scrollTo(0,0);
}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>render(b.dataset.l));
const bg=document.querySelector('.bg');
for(let i=0;i<22;i++){const s=document.createElement('i');s.className='spark';s.style.left=Math.random()*100+'%';s.style.animationDuration=(8+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';s.style.transform='scale('+(.6+Math.random()*1.2)+')';bg.appendChild(s)}
</script>
</body>
</html>
